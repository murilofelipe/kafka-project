name: Code Quality and Coverage

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  analyze:
    name: Code Quality, Coverage, and Duplications
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest pytest-cov pylint

    - name: Check code quality (flake8)
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --max-complexity=10 --max-line-length=127 --statistics || true

    - name: Check for code duplications (pylint)
      run: |
        pylint --disable=all --enable=duplicate-code src/ || true

    - name: Run tests with coverage (pytest & pytest-cov)
      run: |
        # Run pytest. If no tests are collected (exit code 5), don't fail the build.
        pytest --cov=src --cov-report=term --cov-report=xml tests/ || ( [[ $? -eq 5 ]] && exit 0 || exit $? )
